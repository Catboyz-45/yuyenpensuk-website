services:
  web:
    build: .
    container_name: yuyenpensuk-web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "1"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      ADMIN_SUBDOMAIN: admin
    volumes:
      - /opt/yuyenpensuk/data:/app/data
      - /opt/yuyenpensuk/uploads:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
